# Stack with the OpenMANIPULATOR-P + OM-X gripper. Run with task=Stack_omp.
# Same schedule as Stack.yaml (paper values); the env block adds the OM-P settings.
name: Stack

env:
  robot: 'OpenManipulatorP'
  controller: 'default_open_manipulator_p'
  state_dim: 4
  use_latch: False
  wp_steps: 50
  gripper_steps: 15
  orientation_hold: True
  env_kwargs:                                # adapted layout (original: cubeA x [-0.08, -0.04], cubeB x [0.02, 0.08], both y +-0.08)
    cubeA_x_range: [-0.03, 0.01]             # cubeA straight in front of the start pose (like Lift): the gripper's
    cubeA_y_range: [-0.05, -0.01]            #   fingers open along y, so a sideways approach would push the cube away
    cubeB_x_range: [-0.04, 0.00]             # cubeB >= 13 cm to the side: rlwp carries cubeA in a straight line to
    cubeB_y_range: [0.12, 0.16]              #   the drop point, so cubeA and the leading finger must rise 5 cm first
    cubeA_full_size: [0.04, 0.04, 0.04]      # the paper's cubes: 40 mm onto 50 mm. A 50 mm cubeB gives ~2.8x the landing
    cubeB_full_size: [0.05, 0.05, 0.05]      #   area of 30 mm, so exploratory releases land (and get rewarded) far more
                                             #   often; with 30 mm cubes Stack reached 0-48 %. Set to your real cubes
    relative_stack_check: true               # stacked = cubeA's bottom on cubeB's top (actual heights), not a fixed
                                             #   5 cm above the table, which only fits the stock 40/50 mm cubes
  workspace:                             # from omp_tools/check_omp_workspace.py (1.7 cm base plate)
    low:  [-0.20, -0.20, 0.825]
    high: [ 0.05,  0.20, 0.905]


task:
  action_space: 0.5
  batch_size: 30
  epoch_wp: 300

  exploration_epoch: 75
  ensemble_sampling_epoch: 150
  averaging_noise_epoch: 250
  rand_reset_epoch: 250

  num_eval: 100
