# Stack with the OpenMANIPULATOR-P + OM-X gripper. Run with task=Stack_omp.
# Same schedule as Stack.yaml (paper values); the env block adds the OM-P settings.
# WARNING (9 mm base plate): not viable in this layout. cubeB spawns 0.35-0.40 m from the base, where the arm cannot
# carry cubeA above cubeB's top (scripted stacking: 1/10). Needs the base moved closer, a higher base, or a smaller
# spawn region before training (see IMPLEMENTATION_LOG.md, T3b).
name: Stack

env:
  robot: 'OpenManipulatorP'
  controller: 'default_open_manipulator_p'
  state_dim: 4
  use_latch: False
  wp_steps: 50
  gripper_steps: 15
  orientation_hold: True
  workspace:                                 # covers cubeA x [-0.08, -0.04] and cubeB x [0.02, 0.08], y +-0.08
    low:  [-0.25, -0.15, 0.83]
    high: [ 0.10,  0.15, 0.88]


task:
  action_space: 0.5
  batch_size: 30
  epoch_wp: 300

  exploration_epoch: 75
  ensemble_sampling_epoch: 150
  averaging_noise_epoch: 250
  rand_reset_epoch: 250

  num_eval: 100
