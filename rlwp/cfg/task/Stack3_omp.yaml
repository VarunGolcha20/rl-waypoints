# Stack with THREE waypoints for the OpenMANIPULATOR-P + OM-X gripper. Run with task=Stack3_omp.
# 1: grasp cubeA (close), 2: carry it over cubeB (stay closed), 3: lower it onto cubeB (open) - a short, accurate drop
# instead of the 2-waypoint scheme's release from the carry height. Same env settings and per-waypoint schedule as
# Stack_omp.yaml, so waypoints 1-2 can be warm-started from a Stack_omp run (start_wp=3 init_from=<run>).
name: Stack
num_wp: 3

env:
  robot: 'OpenManipulatorP'
  controller: 'default_open_manipulator_p'
  state_dim: 4
  use_latch: False
  wp_steps: 50
  gripper_steps: 15
  orientation_hold: True
  env_kwargs:                                # adapted layout (original: cubeA x [-0.08, -0.04], cubeB x [0.02, 0.08], both y +-0.08)
    cubeA_x_range: [-0.03, 0.01]             # cubeA straight in front of the start pose (like Lift): the gripper's
    cubeA_y_range: [-0.03, 0.00]              #   fingers open along y, so a sideways approach would push the cube away
    cubeB_x_range: [-0.04, 0.00]             # cubeB >= 13 cm to the side: rlwp carries cubeA in a straight line to
    cubeB_y_range: [0.13, 0.17]              #   the drop point, so cubeA and the leading finger must rise 5 cm first
    cubeA_full_size: [0.055, 0.055, 0.055]   # carried cube 55 mm (user's choice)
    cubeB_full_size: [0.065, 0.065, 0.048]   # landing cube 65 mm, set 17 mm deep in a recess: only the top 48 mm stand
                                             #   above the table (a full 65 mm top is too close to the arm's carry limit:
                                             #   scripted Stack 11/20). Same 65 x 65 mm landing area
                                             # (55 mm cubeA leaves ~12 mm per open finger: spawn it nearly straight
                                             #   ahead, else the leading finger bumps it; cubeB 1 cm further out)
    align_weight: 3.0                        # reward for holding cubeA over cubeB: 3 * (1 - tanh(20 * distance)), was
    align_sharpness: 20.0                    #   0.5 * (1 - tanh(10 * d)): hovering aligned was worth only ~4 points more
                                             #   per episode than hovering 9 cm off, so waypoint 2 never moved over cubeB
    relative_stack_check: true               # stacked = cubeA's bottom on cubeB's top (actual heights), not a fixed
                                             #   5 cm above the table, which only fits the stock 40/50 mm cubes
  workspace:                             # from omp_tools/check_omp_workspace.py (1.7 cm base plate)
    low:  [-0.20, -0.20, 0.825]
    high: [ 0.05,  0.20, 0.905]


task:
  action_space: 0.5
  batch_size: 30
  epoch_wp: 300

  exploration_epoch: 75
  ensemble_sampling_epoch: 150
  averaging_noise_epoch: 250
  rand_reset_epoch: 250

  num_eval: 100
